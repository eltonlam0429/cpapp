</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div id="app">
    <main id="view"></main>
  </div>
  <nav class="tabbar" id="tabbar">
    <a href="#/home" data-tab="home"><svg class="i" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>主頁</a>

    <a href="#/lists" data-tab="lists"><svg class="i" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/></svg>清單</a>
    <a href="#/calendar" data-tab="calendar"><svg class="i" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>日曆</a>
    <a href="#/profile" data-tab="profile"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>個人檔案</a>
  </nav>
  <script>
    /* 載入器：先讀 version.json，用版本號載入檔案，確保更新後拿到新檔案 */
    (function () {
      var FILES = ['style.css', 'js/data.js', 'js/nlp.js', 'js/ui.js', 'js/store.js', 'js/period.js', 'js/extras.js', 'js/more.js', 'js/app.js'];
      function load(v) {
        window.APP_VERSION = v;
        FILES.forEach(function (f) {
          var q = f + '?v=' + encodeURIComponent(v);
          if (/\.css$/.test(f)) { var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = q; document.head.appendChild(l); }
          else { var s = document.createElement('script'); s.src = q; s.async = false; document.body.appendChild(s); }
        });
      }
      try { if (localStorage.getItem('us.theme') === 'mint') document.documentElement.dataset.theme = 'mint'; } catch (e) {}
      var saved = null;
      try { saved = localStorage.getItem('us.ver'); } catch (e) {}
      var done = false;
      var timer = setTimeout(function () { if (!done) { done = true; load(saved || '0'); } }, 2500);
      fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
        if (done) return; done = true; clearTimeout(timer);
        try { localStorage.setItem('us.ver', j.version); } catch (e) {}
        load(j.version);
      }).catch(function () { if (!done) { done = true; clearTimeout(timer); load(saved || '0'); } });
    })();
  </script>
</body>
</html>

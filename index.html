<title>錢跡</title>
<style>
/* Layout: phone-first single column (max 560px), white rounded cards on a soft mint ground, deep-teal hero, fixed bottom tab bar */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --surface-2:#F3F5F9; --ink:#17223A; --ink-2:#56607A; --ink-3:#8C95A8; --line:#E2E6EE;
  --accent:#2F4F82; --accent-ink:#FFFFFF; --accent-soft:#E3E9F3; --bar:#BCCBE0; --bar-sel:#2C4A7C;
  --hero-a:#2A4069; --hero-b:#47699B; --hero-ink:#FFFFFF;
  --red:#E5484D; --amber:#F0A132; --green:#2FA36B; --red-soft:#FDEDED; --red-line:#F6C9CA;
  --shadow:0 1px 2px rgba(23,34,58,.04),0 8px 24px rgba(23,34,58,.05);
  --font:-apple-system,BlinkMacSystemFont,"PingFang HK","PingFang TC","Noto Sans HK","Microsoft JhengHei",sans-serif;
  --num:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131B; --surface:#171E2A; --surface-2:#1E2734; --ink:#E8EDF6; --ink-2:#A8B2C4; --ink-3:#77839A; --line:#28334A;
  --accent:#8EAEE4; --accent-ink:#0E131B; --accent-soft:#223149; --bar:#344863; --bar-sel:#8EAEE4;
  --hero-a:#203556; --hero-b:#355A8D; --hero-ink:#FFFFFF;
  --red:#F2676B; --amber:#F2B04F; --green:#4CC38A; --red-soft:#3A1F24; --red-line:#5A2C32;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E131B; --surface:#171E2A; --surface-2:#1E2734; --ink:#E8EDF6; --ink-2:#A8B2C4; --ink-3:#77839A; --line:#28334A;
  --accent:#8EAEE4; --accent-ink:#0E131B; --accent-soft:#223149; --bar:#344863; --bar-sel:#8EAEE4;
  --hero-a:#203556; --hero-b:#355A8D; --hero-ink:#FFFFFF;
  --red:#F2676B; --amber:#F2B04F; --green:#4CC38A; --red-soft:#3A1F24; --red-line:#5A2C32;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:560px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
.app-icon{width:40px;height:40px;border-radius:10px;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.brand{font-weight:700;font-size:19px;color:var(--accent);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{border:1px solid transparent;border-radius:12px;padding:8px 12px;font-size:14px;background:var(--accent-soft);color:var(--accent);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.pill.outline{background:var(--surface);border-color:var(--line);color:var(--ink)}
.pill svg{width:15px;height:15px}

main{max-width:560px;margin:0 auto;padding:18px 16px calc(110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.tab[hidden],[hidden]{display:none!important}
.tab{display:flex;flex-direction:column;gap:16px}

.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.eyebrow{font-size:13px;color:var(--ink-2);letter-spacing:.06em}
h1{font-size:30px;line-height:1.2;margin:4px 0 0;font-weight:800;text-wrap:balance;letter-spacing:.01em}
h2{font-size:19px;margin:0;font-weight:700}
h3{font-size:17px;margin:0;font-weight:700}
.month-pick{display:flex;flex-direction:column;gap:4px;min-width:0}
.month-pick select{appearance:none;-webkit-appearance:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 18px;font-size:16px;text-align:center;min-width:170px}
.status-row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;background:var(--ink-3)}
.dot.pending{background:var(--red)} .dot.processing{background:var(--amber)} .dot.confirmed{background:var(--green)}
.legend span,.status-row span{display:inline-flex;align-items:center;gap:6px}

.card{background:var(--surface);border-radius:20px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)} .small{font-size:13px}
.label-caps{font-size:12px;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase}

.quick{display:flex;gap:10px}
.quick input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 14px;font-size:17px}
.btn{border:0;border-radius:14px;padding:12px 18px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;white-space:nowrap}
.btn.big{padding:13px 22px;font-size:18px}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.danger.armed{background:var(--red);color:#fff}
.btn.sm{padding:8px 12px;font-size:14px;border-radius:11px}
.btn:disabled{opacity:.5}

.hero{background:linear-gradient(135deg,var(--hero-a),var(--hero-b));color:var(--hero-ink);border-radius:22px;padding:22px 22px 20px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 45%,rgba(255,255,255,.07) 46%,transparent 80%);pointer-events:none}
.hero .big{font-size:48px;font-weight:700;line-height:1.15;letter-spacing:-.01em}
.hero .rule{height:2px;background:rgba(255,255,255,.28);border-radius:2px;margin:10px 0 6px}
.hero small{opacity:.85;font-size:14px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:360px){.grid2{grid-template-columns:1fr}}
.stat .ic{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.stat .ic svg{width:18px;height:18px}
.stat .v{font-size:clamp(19px,6.2vw,30px);font-weight:700;line-height:1.1;white-space:nowrap}
.stat .hidden-v{letter-spacing:.12em;color:var(--ink-3)}

.kpis{display:flex;gap:28px;flex-wrap:wrap}
.kpis .k{font-size:14px;color:var(--ink-2)}
.kpis .kv{font-size:22px;font-weight:700;color:var(--accent)}
.chip.desig{color:#C62828;font-weight:700}.chip.desig[aria-pressed="true"]{background:#C62828;color:#fff}
.bars{display:flex;align-items:flex-end;gap:3px;height:190px;padding-top:6px}
.bars button{flex:1;min-width:0;height:100%;display:flex;align-items:flex-end;background:none;border:0;padding:0}
.bars i{display:block;width:100%;border-radius:3px 3px 1px 1px;background:var(--bar);min-height:5px;transition:background .15s}
.bars button[aria-pressed="true"] i{background:var(--bar-sel)}
.bars i.clip{position:relative}
.brk{position:absolute;left:-2px;right:-2px;top:38%;height:7px;background:var(--surface);transform:skewY(-28deg);border-top:1.5px solid currentColor;border-bottom:1.5px solid currentColor;color:var(--bar)}
.bars button[aria-pressed="true"] .brk{color:var(--bar-sel)}
.clip-note{display:flex;gap:8px;align-items:center}
.clip-key{position:relative;display:inline-block;width:10px;height:20px;background:var(--bar);border-radius:2px;flex:none}
.bars button:disabled{cursor:default}
.bar-axis{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin-top:-4px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:0;background:var(--accent-soft);color:var(--ink-2);border-radius:12px;padding:8px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.datef{display:grid;grid-template-columns:1.15fr 1fr 1.3fr;gap:8px}.datef.two{grid-template-columns:1fr 1fr}
.datef select,.li select{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 8px;font-size:16px;min-width:0;width:100%}
.li select{width:auto;max-width:9.5em;padding:7px 8px;font-size:15px}

function producedBy(line){const hit=x=>x&&(x===line||line.includes(x));return S.txns.concat(S.trash.filter(e=>e.kind==='txn').map(e=>e.item)).some(t=>(t.raw||[]).some(hit))||S.incomeEntries.some(e=>(e.raw||[]).some(hit))}
function importText(text,opts={}){
  const res={added:0,merged:0,review:0,skipped:0,dupe:0,income:0,src:{pay:0,sms:0,mail:0,ocr:0}};
  S.lastSeen=S.lastSeen||{};
  for(const r of parseInbox(text)){
    if(res.src[r.kind]!=null&&!r.pasted){res.src[r.kind]++;S.lastSeen[r.kind]=fmtLocal(new Date())}
    if(r.kind==='mail')noteSender(r.line);
    // 已處理過嘅行唔會再讀；「重新分析」時會補返之前讀唔到（冇產生記錄）嘅行
    const h=hash(r.line);const prev=S.imported[h];
    if(prev&&!(opts.reread&&(prev==='s'||!producedBy(r.line)))){res.dupe++;continue}
    S.imported[h]='s';
    LINE_FX=fxDetect(r.parts.slice(1).join(' || '));
    // 外幣：冇港元金額就用匯率換算；有埋港元金額（銀行已換算）就用港元，外幣金額只作記錄
    if(LINE_FX){const L2=r.line.replace(LINE_FX.raw,LINE_FX.hkd?' ':`HKD ${r2(LINE_FX.amt*fxRate(LINE_FX.cur))}`);const r2_=parseInbox(L2)[0];if(r2_)r.parts=r2_.parts}
    if(r.kind==='ocr'||r.kind==='mail'){
      const src=r.kind==='mail'?'mail':'notif';
      if(!S.channels[src]){res.skipped++;continue}
      const ts=parseTime(r.parts[1])||fmtLocal(new Date());
      if(src==='mail'&&mailBlocked(r.line)){res.skipped++;continue}
      if(src==='notif'&&notifBlocked(r.line)){res.skipped++;continue}
      if(src==='mail'){const bk=parseBankMail(r.parts.slice(2).join(' ¦ '));
        if(bk){if(bk.skip){res.skipped++;continue}S.imported[h]=1;if(bk.type==='income'){routeIncome({ts,amount:bk.amount,name:bk.merchant,src:'mail',raw:r.line},res,r.line);continue}ingest({ts,amount:bk.amount,merchant:bk.merchant,channel:bk.channel,type:bk.type,source:'mail'},r.line,res);continue}}
      const items=parseNotifs(r.parts.slice(2).join(' ¦ '),src==='mail');
      if(src==='notif'&&handleOctoBalance(r.parts.slice(2).join(' ¦ '),ts,r.line,res)){S.imported[h]=1;continue}
      if(!items.length){
        const w=src==='notif'?parseWalletNotif(r.parts.slice(2).join(' ¦ ')):null;
        if(!w){res.skipped++;continue}
        S.imported[h]=1;
        if(w.type==='income')routeIncome({ts,amount:w.amount,name:w.merchant,src,raw:r.line},res,r.line);
        else ingest({ts,amount:w.amount,merchant:w.merchant,channel:w.channel,type:w.type,source:'notif'},r.line,res);
        continue}
      for(const it of items){
        const k='n'+hash(it.key);if(S.imported[k]){res.dupe++;continue}S.imported[k]=1;
        S.imported[h]=1;
        if(it.type==='income')routeIncome({ts,amount:it.amount,name:`${it.appName}${it.party?' · 由 '+it.party:' 收款'}`,src,raw:src==='mail'?r.line:it.text},res,r.line);
        else ingest({ts,amount:it.amount,merchant:it.party?`${it.appName} · ${it.party}`:it.appName,channel:it.card||(it.app!=='other'?notifChannel(it.app):detectChannel(it.text,src)),type:it.type,source:src,note:it.discount?`已扣除優惠券／折扣 $${it.discount}`:''},src==='mail'?r.line:it.text,res);
      }

    if(r.kind==='sms'&&smsBlocked(r.line)){res.skipped++;continue}
    const o=recToTxn(r);if(o.skip){res.skipped++;continue}
    S.imported[h]=1;
    if(o.t.type==='income'||(o.t.type==='transfer'&&matchIncomeTpl(r.line,o.t.ts)&&/(存入|入賬|credited|deposit|收到|received|薪金|salary|payroll|出糧)/i.test(r.line))){routeIncome({ts:o.t.ts,amount:o.t.amount,name:o.t.merchant,src:o.t.source,raw:r.line},res,r.line);continue}
    ingest(o.t,r.line,res);

}

/* 現金快速記帳 */
function parseQuick(input){
  let t=String(input||'').trim();if(!t)return null;
  let channel='cash';
  const PW=[[/轉數快|\bfps\b/i,'fps'],[/payme/i,'payme'],[/boc ?pay/i,'bocpay'],[/支付寶|alipay/i,'alipay'],[/wechat ?pay|微信/i,'wechat'],[/自動轉帳|自動轉賬|自動過數|autopay/i,'autopay'],[/銀行轉帳|銀行轉賬|過數/,'bank'],[/信用卡|碌卡|credit card/i,'credit']];
  for(const[re,v]of PW)if(re.test(t)){channel=v;break}
  if(/八達通|octopus/i.test(t)){const oc=S.cards.find(c=>c.type==='octopus');channel=oc?oc.id:ensureCard('八達通','octopus').id}
  for(const c of S.cards)for(const k of [c.name,...(c.keywords||[])])if(k&&k.length>=2&&!/^\d+$/.test(k)&&t.toLowerCase().includes(k.toLowerCase()))channel=c.id;
  const nums=[...t.matchAll(/(HK\$|\$|＄)?\s*(\d+(?:\.\d{1,2})?)\s*(蚊|元|塊|港元|HKD)?/gi)];
  if(!nums.length)return{error:'搵唔到金額'};
  const pick=nums.filter(n=>n[1]||n[3]).pop()||nums[nums.length-1];
  const amount=parseFloat(pick[2]);if(!(amount>0))return{error:'金額要大過 0'};
  let off=0;if(/(尋日|昨日|昨天|琴日|昨晚|尋晚|琴晚)/.test(t))off=-1;else if(/(前日|前天)/.test(t))off=-2;
  let hm=null;
  if(/早餐|朝早|今朝|breakfast/i.test(t))hm=[8,30];else if(/下午茶/.test(t))hm=[15,30];else if(/午餐|午飯|晏晝|lunch/i.test(t))hm=[13,0];else if(/宵夜/.test(t))hm=[23,0];else if(/晚餐|晚飯|夜晚|今晚|昨晚|尋晚|dinner/i.test(t))hm=[19,30];
  const d=new Date();d.setDate(d.getDate()+off);
  if(hm){const c=new Date(d);c.setHours(hm[0],hm[1],0,0);if(off<0||c<=new Date())d.setHours(hm[0],hm[1],0,0)}else if(off<0)d.setHours(12,0,0,0);
  let desc=t.replace(pick[0],' ').replace(/俾返我|畀返我|還返我|俾返|畀返|還返|人哋|收到|轉數快|fps|payme|boc ?pay|支付寶|alipay|wechat pay|wechat|微信|自動轉帳|自動轉賬|自動過數|autopay|銀行轉帳|銀行轉賬|過數|信用卡|碌卡|credit card|現金|cash|八達通|octopus|啱啱|剛剛|頭先|今日|今朝|尋日|昨日|昨天|琴日|前日|前天|尋晚|琴晚|用咗|使咗|花咗|花了|俾咗|畀咗|用|俾|畀|咗|了|嘅|喺|係/gi,' ');
  for(const c of S.cards)for(const k of [c.name,...(c.keywords||[])])if(k&&k.length>=2&&!/^\d+$/.test(k))desc=desc.replace(new RegExp(escRe(k),'ig'),' ');
  desc=desc.replace(/[，,。.!！?？$＄:：]/g,' ').replace(/\s+/g,' ').replace(/([\u3400-\u9fff])\s+(?=[\u3400-\u9fff])/g,'$1').trim();
  const category=categorize(desc||t);
  if(!desc)desc=category;
  return{ts:fmtLocal(d),amount:r2(amount),merchant:desc.slice(0,40),channel,category,confident:category!=='其他'};
}

function rebateCycle(card,dk=todayKey()){
  const rd=Math.max(1,Math.min(31,+((card.rebate||{}).resetDay)||1));const at=ym=>`${ym}-${pad(Math.min(rd,daysIn(ym)))}`;

    const ys=pad(Math.max(1,Math.min(12,+card.rebate.yearStart||1)));let y=+dk.slice(0,4),s=at(`${y}-${ys}`);if(dk<s){y--;s=at(`${y}-${ys}`)}

    return{s,e,year:true,label:ys==='01'&&rd===1?`${y} 年度`:`${s.slice(8)}/${s.slice(5,7)}/${s.slice(0,4)}–${l.slice(8)}/${l.slice(5,7)}/${l.slice(0,4)}`};

  const tx=S.txns.find(t=>lineHit(t,line));if(tx)return{tx};
  const tr=S.trash.find(e=>e.kind==='txn'&&e.item&&lineHit(e.item,line));if(tr)return{tr};
  const ie=S.incomeEntries.find(e=>lineHit(e,line));if(ie)return'已記做收入（定期收入卡）';
  const words=k=>String(S.settings[k]||'').split(/[,，、\n]/).map(x=>x.trim()).filter(Boolean);
  if(r.kind==='sms'){if(!S.channels.sms)return'「銀行短訊」收集已關閉';const w=words('smsBlock').find(w=>line.toLowerCase().includes(w.toLowerCase()));if(w)return`短訊略過字眼「${w}」`;
    try{const o=recToTxn(r);if(o.skip)return o.skip}catch(e){return'讀唔到：'+e.message}}
  if(r.kind==='mail'){if(mailBlocked(line))return'電郵寄件人喺黑名單／略過字眼'}
  if(r.kind==='ocr'){if(notifBlocked(line))return'通知略過字眼'}
  return S.imported[hash(line)]?'之前讀過但冇產生記錄（可能係重複、驗證碼或者唔似交易）':'未處理';
}

async function connect(url,token){
  url=String(url||'').trim();token=String(token||'').trim();
  if(!/^https:\/\/script\.google(usercontent)?\.com\/.+/.test(url))throw new Error('網址要係 https://script.google.com/macros/s/…/exec');
  if(token.length<16)throw new Error('密碼最少 16 個字');
  const prev=CONN;CONN={url,token};
  let res;try{res=await api(null,{action:'pull',since:0,ver:0})}catch(e){CONN=prev;throw e}
  storeConn();SYNC={ver:0,dirty:false,lastOk:null,sheetUrl:res.sheetUrl||null};
  if(res.state){S=hydrate(JSON.parse(res.state));SYNC.ver=res.ver;localSave();storeSync()}
  else{if(S.demo)S=blankState();S.inboxSince=0;localSave();storeSync();await syncPush()}
  net.state='ok';await syncPull(false);
  return!!res.state;
}

function quickAdd(text){
  let type=ui.qType||'expense';
  if(/^\s*(收入|收到|人哋俾返|俾返我|畀返我|還返我)/.test(text))type='income';
  if(type==='expense'&&!S.channels.cash){toast('現金快速記帳已喺「錢包」關閉');return}
  const p=parseQuick(String(text).replace(/^\s*(收入|收到)\s*/,''));
  if(!p)return;
  if(p.error){toast(p.error+(type==='income'?'，例如：朋友俾返 晚飯 150':'，例如：現金 午餐 45'));return}
  const inp=$('#quick-in');
  if(type==='income'){
    const name=p.merchant===p.category?'收入':p.merchant;
    const e={id:uid(),ts:p.ts,amount:p.amount,merchant:name||'收入',category:'其他',channel:'cash',type:'income',status:'confirmed',source:'quick',sources:['quick'],raw:[text],note:'單一收入',catChecked:true};
    S.txns.push(e);ui.qType='expense';save();render();
    toast(`已記低單一收入：${e.merchant} ${money(e.amount)}（${+e.ts.slice(5,7)}月${+e.ts.slice(8,10)}日，喺明細睇）`,'復原',()=>{S.txns=S.txns.filter(x=>x!==e);save();render()});
    return;
  }
  const t={id:uid(),ts:p.ts,amount:p.amount,merchant:p.merchant,category:p.category,channel:p.channel,type:'expense',status:p.confident?'confirmed':'pending',source:'cash',sources:['cash'],raw:[text],note:''};
  S.txns.push(t);save();ui.month=t.ts.slice(0,7);ui.selDay=+t.ts.slice(8,10);render();
  toast(`已記低：${t.merchant} ${money(t.amount)}（${t.category} · ${chName(t.channel)}）${p.confident?'':' · 待確認'}`,'復原',()=>{S.txns=S.txns.filter(x=>x.id!==t.id);save();render()});
}

/* ===================== 明細 ===================== */
function renderRecords(){
  const{mode,anchor}=ui.rec;const{s,e,label}=range(mode,anchor);
  // 下面只列已核實記錄；未核實嘅只喺「待核實」出現，核實後先會移落嚟
  const all=inRange(s,e);const tx=all.filter(t=>t.status==='confirmed');const unv=all.filter(t=>t.status!=='confirmed');
  const exp=sum(tx.filter(isExp)),ref=sum(tx.filter(isRef));
  const open=S.reviews.filter(r=>!r.resolved&&S.txns.find(t=>t.id===r.a)&&S.txns.find(t=>t.id===r.b));
  const inRev=new Set(open.flatMap(r=>[r.a,r.b]));
  const sugg=S.txns.filter(t=>t.status!=='confirmed'&&(t.suggestTpl||t.suggestBill));
  const mchk=S.txns.filter(t=>t.status!=='confirmed'&&t.mailCheck&&!t.suggestTpl).sort((a,b)=>a.ts<b.ts?1:-1);
  const pend=S.txns.filter(t=>t.status!=='confirmed'&&!inRev.has(t.id)&&!t.suggestTpl&&!t.suggestBill&&!t.mailCheck).sort((a,b)=>a.ts<b.ts?1:-1);
  // 已核實嗰筆喺度只作參考，唔可以喺待核實區改或刪，避免誤刪真正記錄
  const rvRow=t=>t.status==='confirmed'?txRow(t).replace(/^<button class="li" type="button" data-act="edit" data-id="[^"]*"/,'<div class="li ref"').replace(/<\/button>$/,'</div>'):txRow(t);
  const tag=t=>t.status==='confirmed'?'<div class="rv-tag ok">現有記錄 · 已核實</div>':'<div class="rv-tag new">新收到 · 待核實</div>';
  let body='';
  const desc=[...tx].reverse();
  if(!desc.length)body=`<div class="empty">呢段時間冇已核實記錄${unv.length?'，請先喺上面核實':''}</div>`;
  else if(mode==='year'){
    const byM={};desc.forEach(t=>(byM[t.ts.slice(0,7)]=byM[t.ts.slice(0,7)]||[]).push(t));
    body=Object.keys(byM).map(k=>{const x=byM[k];return`<button class="li" type="button" data-act="drill" data-anchor="${k}-01"><span class="grow"><span class="t" style="display:block">${+k.slice(5)}月</span><span class="m">${x.filter(isExp).length} 筆支出 · 撳入去睇細項</span></span><span class="amt num">${money(sum(x.filter(isExp)))}</span></button>`}).join('');
  }else if(mode==='day')body=desc.map(txRow).join('');
  else{
    const byD={};const dk=t=>t.noDay?t.ts.slice(0,7)+'-00':t.ts.slice(0,10);desc.forEach(t=>(byD[dk(t)]=byD[dk(t)]||[]).push(t));
    body=Object.keys(byD).map(k=>{if(k.endsWith('-00'))return`<div class="group-h"><span>${+k.slice(5,7)}月（未指定日子）</span><span class="num">${money(sum(byD[k].filter(isExp)))}</span></div>`+byD[k].map(txRow).join('');const d=toDate(k+'T00:00');return`<button class="group-h" type="button" data-act="drill-day" data-anchor="${k}"><span>${d.getMonth()+1}月${d.getDate()}日（${WK[d.getDay()]}）</span><span class="num">${money(sum(byD[k].filter(isExp)))}</span></button>`+byD[k].map(txRow).join('')}).join('');
  }
  $('#tab-records').innerHTML=`
  <div class="page-head"><div><div class="eyebrow">每一筆都喺度</div><h1>交易明細</h1></div><div class="actions" style="flex:none"><button class="btn sm line" type="button" data-act="trash">垃圾筒${S.trash.length?`（${S.trash.length}）`:''}</button><button class="btn sm" type="button" data-act="new-tx">＋ 新增支出</button></div></div>
  ${open.length||pend.length||sugg.length||mchk.length?`<div class="card pending-zone"><div class="card-head"><h3>待核實</h3><span class="small muted">${open.length} 組可能重複 · ${pend.length+mchk.length} 筆待確認</span></div>
    <div class="small muted">呢度嘅記錄未計入下面嘅已核實記錄。撳入去可以改或刪除，確認之後就會移落去。</div>
    ${sugg.map(t=>{const T=t.suggestTpl&&S.incomeTemplates.find(x=>x.id===t.suggestTpl);const B=t.suggestBill&&S.bills.find(x=>x.id===t.suggestBill.bid);
      const exp=T?(((S.incomeOverrides[T.id]||{})[t.linkMonth])??T.amount):B?((((S.billOverrides[B.id]||{})[t.suggestBill.key])||{}).amount??B.amount):0;
      return`<div class="review"><div class="q">${T?`收到 ${money(t.amount)}，似係「${esc(T.name)}」${+t.linkMonth.slice(5)} 月（設定 ${money(+exp)}），${t.note&&/已經收到一筆/.test(t.note)?`（注意：${esc(t.note)}）`:''}`:`扣咗 ${money(t.amount)}，似係定期支出「${esc(B.name)}」（設定 ${money(+exp)}），金額唔同。`}</div><div class="list">${txRow(t)}</div>
      <div class="acts"><button class="btn sm" type="button" data-act="sg-replace" data-id="${t.id}">用實際金額取代${T?`${+t.linkMonth.slice(5)} 月收入`:'嗰期'}</button><button class="btn sm ghost" type="button" data-act="sg-extra" data-id="${t.id}">${T?'當單一收入（唔計入定期收入）':'當普通支出（另計）'}</button>${T?`<button class="btn sm line" type="button" data-act="sg-not" data-id="${t.id}">唔係收入（不計）</button>`:''}</div></div>`}).join('')}

    ${mchk.slice(0,40).map(t=>{const m=mailSender((t.raw||[])[0]);return`<div class="review"><div class="q">電郵話收到 ${money(t.amount)}。寄件人：${m&&(S.mailSenders||{})[m.key]?`<button type="button" data-act="ms-open" data-k="${esc(m.key)}" style="background:none;border:0;padding:0;font:inherit;font-weight:700;color:var(--accent);text-decoration:underline">${esc(m.name)}（睇最近標題）</button>`:`<b>${esc(m?m.name:'不明')}</b>`}${m?` <span class="faint" style="overflow-wrap:anywhere;display:block">${esc(m.addr||'@'+m.dom)}</span>`:''}</div><div class="list">${txRow(t)}</div>
      <div class="acts"><button class="btn sm" type="button" data-act="mc-ok" data-id="${t.id}">係收入</button>${m?`<button class="btn sm ghost" type="button" data-act="mc-white" data-id="${t.id}">信任寄件人（白名單）</button>`:''}<button class="btn sm line" type="button" data-act="mc-no" data-id="${t.id}">唔係收入</button>${m?`<button class="btn sm line" type="button" data-act="mc-black" data-id="${t.id}" style="color:var(--red)">封鎖寄件人（黑名單）</button>`:''}</div></div>`}).join('')}

    ${open.map(r=>{const a=S.txns.find(t=>t.id===r.a),b=S.txns.find(t=>t.id===r.b);const mins=Math.round(Math.abs(toDate(a.ts)-toDate(b.ts))/6e4);return`<div class="review"><div class="q">${r.kind==='repeat'?`同一商戶、同一金額，相隔 ${mins} 分鐘。係一筆定兩筆？`:`${SRC_L[a.source]||'通知'} 同 ${SRC_L[b.source]||'通知'} 金額一樣（相隔 ${mins>=60?Math.round(mins/6)/10+' 小時':mins+' 分鐘'}），可能係同一筆。`}</div><div class="list">${tag(a)}${rvRow(a)}${tag(b)}${rvRow(b)}</div><label class="field"><span>分類（自動判斷，可以改）</span><select data-act="rev-cat" data-id="${r.id}">${catOptions(a.category)}</select></label><div class="acts"><button class="btn sm" type="button" data-act="rev-same" data-id="${r.id}">同一筆，合併</button><button class="btn sm ghost" type="button" data-act="rev-diff" data-id="${r.id}">${r.kind==='repeat'?'真係兩筆（多次）':'唔同交易，保留兩筆'}</button></div><div class="small faint">「合併」會保留上面嗰筆，下面嗰筆會移去垃圾筒。</div></div>`}).join('')}

/* ===================== 報表 ===================== */
function catTotals(s,e){const tx=inRange(s,e);const K=allCatKeys();const o={};K.forEach(c=>o[c]={amt:0,n:0});const g=k=>o[k]||(isDesig(k)?(o[k]={amt:0,n:0}):o['其他']);tx.forEach(t=>{if(isExp(t)){g(t.category).amt+=t.amount;g(t.category).n++}else if(isRef(t))g(t.category).amt-=t.amount});Object.keys(o).forEach(c=>o[c].amt=r2(o[c].amt));return{o,tx}}
function renderAnalysis(){
  const{mode,anchor,cat}=ui.ana;const{s,e,label}=range(mode,anchor);
  const cur=catTotals(s,e),pr=range(mode,shift(mode,anchor,-1));const prev=catTotals(pr.s,pr.e).o;
  const KS=[...new Set([...Object.keys(cur.o),...Object.keys(prev)])];KS.forEach(k=>{cur.o[k]=cur.o[k]||{amt:0,n:0};prev[k]=prev[k]||{amt:0,n:0}});
  const total=r2(KS.reduce((a,c)=>a+Math.max(0,cur.o[c].amt),0));const ptotal=r2(KS.reduce((a,c)=>a+Math.max(0,prev[c].amt),0));
  const rows=KS.filter(c=>cur.o[c].amt||prev[c].amt).sort((a,b)=>cur.o[b].amt-cur.o[a].amt);
  const top=Math.max(...rows.map(c=>cur.o[c].amt),1);
  const delta=(a,b)=>{if(!b)return a?'<span class="small faint">新</span>':'';const p=Math.round((a-b)/b*100);return`<span class="small delta ${p>0?'up':'down'}">${p>0?'▲':'▼'} ${Math.abs(p)}%</span>`};
  let detail='';
  if(cat){
    const hist=[];for(let k=5;k>=0;k--){const a=shift(mode,anchor,-k);const r=range(mode,a);hist.push({l:mode==='month'?(+a.slice(5,7))+'月':mode==='year'?a.slice(0,4):mode==='quarter'?'Q'+(Math.floor((+a.slice(5,7)-1)/3)+1):mode==='week'?`${r.s.getMonth()+1}/${r.s.getDate()}`:`${+a.slice(8)}日`,v:(catTotals(r.s,r.e).o[cat]||{amt:0}).amt})}
    const hm=Math.max(...hist.map(h=>h.v),1);
    const ctx=cur.tx.filter(t=>t.category===cat&&(isExp(t)||isRef(t))).reverse();
    const mer={};ctx.filter(isExp).forEach(t=>{const k=normMerchant(t.merchant)||t.merchant;(mer[k]=mer[k]||{name:t.merchant,amt:0,n:0});mer[k].amt+=t.amount;mer[k].n++});
    const topM=Object.values(mer).sort((a,b)=>b.amt-a.amt).slice(0,5);
    detail=`<div class="card"><div class="card-head"><h3>${catChip(cat)}</h3><button class="btn sm line" type="button" data-act="ana-cat" data-cat="">收起</button></div>
      <div class="small muted">最近 6 個${MODE_L[mode]}</div>
      <div class="mini-bars">${hist.map(h=>`<div><span class="num">${h.v?Math.round(h.v):''}</span><i style="height:${Math.max(3,h.v/hm*80)}%;${''}"></i><span>${h.l}</span></div>`).join('')}</div>
      ${topM.length?`<div class="small muted">最常光顧</div><div class="list">${topM.map(x=>`<div class="li"><span class="grow"><span class="t" style="display:block">${esc(x.name)}</span><span class="m">${x.n} 次</span></span><span class="amt num">${money(x.amt)}</span></div>`).join('')}</div>`:''}
      <div class="small muted">${label}所有記錄</div><div class="list">${ctx.map(txRow).join('')||'<div class="empty">冇記錄</div>'}</div></div>`;
  }
  $('#tab-analysis').innerHTML=`
  <div class="page-head"><div><div class="eyebrow">睇清楚錢去咗邊</div><h1>消費報表</h1></div></div>
  <div class="seg" role="group" aria-label="周期">${['week','month','quarter','year'].map(k=>`<button type="button" data-act="ana-mode" data-mode="${k}" aria-pressed="${mode===k}">${MODE_L[k]}</button>`).join('')}</div>
  <div class="period"><button class="icon-btn" type="button" data-act="ana-prev" aria-label="上一段">‹</button><div class="lbl">${label}</div><button class="icon-btn" type="button" data-act="ana-next" aria-label="下一段">›</button></div>
  <div class="card"><div class="sum-line"><div><div class="small muted">總支出（扣除退款）</div><div class="v num">${money(total)}</div></div><div style="text-align:right">${delta(total,ptotal)}<div class="small faint">對比上一個${MODE_L[mode]} ${money(ptotal)}</div></div></div>
    <div class="list">${rows.length?rows.map(c=>{const v=cur.o[c];return`<button class="cat-row" type="button" data-act="ana-cat" data-cat="${esc(c)}" style="--cc:${catColor(c)}"><span>${catChip(c)} <span class="small faint">${v.n} 筆 · ${total?Math.round(Math.max(0,v.amt)/total*100):0}%</span></span><span style="text-align:right"><b class="num">${money(v.amt)}</b> ${delta(v.amt,prev[c].amt)}</span><span class="track"><i style="width:${Math.max(0,v.amt)/top*100}%"></i></span></button>`}).join(''):'<div class="empty">呢段時間冇支出</div>'}</div>
  </div>
  <div class="card"><div class="card-head"><h3>分類關鍵字</h3><button class="btn sm" type="button" data-act="recat">重新自動分類</button></div>
    <div class="small muted">商戶名包含呢啲字就自動歸入該分類。撳分類打開大格修改。唔理空格同大細楷；4 個字母或以下嘅英文字要成個字對得上。</div>
    <div class="list">${CAT_NAMES.filter(k=>k!=='其他').map(k=>{const L=kwList(k);return`<button class="li" type="button" data-act="ckw-edit" data-k="${esc(k)}"><span class="grow" style="min-width:0">${catChip(k)} <span class="small faint">${L.length} 個字眼</span><span class="m" style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(L.slice(0,12).join('、'))||'（未有）'}</span></span><span class="faint">›</span></button>`}).join('')}</div>
  </div>${detail}`;
}

/* 表單元件：日期（先年後月，日子可以唔揀）、周期、結束 */
function dateFields(id,val,noDay=true){
  const v=val||todayKey();const y=+v.slice(0,4),m=+v.slice(5,7),d=v.length>7?+v.slice(8,10):0;const cy=new Date().getFullYear();
  const ys=[];for(let k=Math.min(y,cy-10);k<=Math.max(y,cy+10);k++)ys.push(k);
  return`<div class="datef" id="${id}"><select data-p="y" aria-label="年">${ys.map(k=>`<option value="${k}" ${k===y?'selected':''}>${k} 年</option>`).join('')}</select><select data-p="m" aria-label="月">${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${i+1===m?'selected':''}>${i+1} 月</option>`).join('')}</select><select data-p="d" aria-label="日">${noDay?`<option value="" ${!d?'selected':''}>不指定日子</option>`:''}${Array.from({length:31},(_,i)=>`<option value="${i+1}" ${i+1===d?'selected':''}>${i+1} 日</option>`).join('')}</select></div>`;
}
function readDate(id){const el=$('#'+id);const g=p=>el.querySelector(`[data-p="${p}"]`).value;const ym=`${g('y')}-${pad(g('m'))}`;const d=g('d');return d?`${ym}-${pad(Math.min(+d,daysIn(ym)))}`:ym}
const CYCLES=[['month:1','每月'],['day:1','每日'],['week:1','每周'],['week:2','每兩周'],['month:3','每季（3 個月）'],['month:6','每半年'],['year:1','每年'],['custom','自訂周期']];
function cycleFields(id,freq='month',every=1){
  const key=`${freq}:${every}`;const preset=CYCLES.some(c=>c[0]===key);
  return`<label class="field"><span>周期</span><select id="${id}-sel">${CYCLES.map(([v,l])=>`<option value="${v}" ${(preset?v===key:v==='custom')?'selected':''}>${l}</option>`).join('')}</select></label>
  <div class="row2" id="${id}-cus" ${preset?'hidden':''}><label class="field"><span>每</span><input id="${id}-n" inputmode="numeric" value="${every}"></label><label class="field"><span>單位</span><select id="${id}-u">${Object.entries(UNIT).map(([k,v])=>`<option value="${k}" ${k===freq?'selected':''}>${v}</option>`).join('')}</select></label></div>`;
}
function bindCycle(id){const s=$('#'+id+'-sel');if(s)s.onchange=()=>{$('#'+id+'-cus').hidden=s.value!=='custom'}}
function readCycle(id){const v=$('#'+id+'-sel').value;if(v!=='custom'){const[f,e]=v.split(':');return{freq:f,every:+e}}const n=parseInt($('#'+id+'-n').value,10);return{freq:$('#'+id+'-u').value,every:n>0?n:1}}
function endFields(id,endDate){
  return`<div class="field"><span>結束</span><div class="radio"><label><input type="radio" name="${id}-r" value="none" ${endDate?'':'checked'}><span>直至另行通知</span></label><label><input type="radio" name="${id}-r" value="date" ${endDate?'checked':''}><span>直至某日（日子可以唔揀）</span></label></div></div><div id="${id}-wrap" ${endDate?'':'hidden'}>${dateFields(id+'-d',endDate||todayKey(),true)}</div>`;
}
function bindEnd(id){document.querySelectorAll(`input[name="${id}-r"]`).forEach(r=>r.onchange=()=>{$('#'+id+'-wrap').hidden=document.querySelector(`input[name="${id}-r"]:checked`).value!=='date'})}
function readEnd(id){return document.querySelector(`input[name="${id}-r"]:checked`).value==='date'?readDate(id+'-d'):null}
const startOfKey=k=>k.length===7?k+'-01':k;
function errIn(id){return msg=>{const e=$('#'+id);e.textContent=msg;e.hidden=false}}

// 改周期：舊設定喺新周期開始前一日結束，之前記錄保留
function changeCycle(list,overrides,x,ns,cy,changes,end){
  const sd=startOfKey(ns);
  const fields=n=>{const oldDay=x.freq==='month'?x.day:(x.startDate?+x.startDate.slice(8,10):null);delete n.startMonth;delete n.startDate;delete n.day;delete n.endMonth;n.freq=cy.freq;n.every=cy.every;
    if(cy.freq==='month'){n.startMonth=ns.slice(0,7);n.day=ns.length>7?+ns.slice(8,10):oldDay}else n.startDate=sd};
  if(sd<=startOfKey(schedStart(x))){Object.assign(x,changes);fields(x);x.endDate=end;return x}
  const nt={...x,...changes,id:uid(),endDate:end};delete nt.nextId;fields(nt);x.endDate=addDays(sd,-1);x.nextId=nt.id;
  const ov=overrides[x.id]||{};for(const k of Object.keys(ov))if(startOfKey(k)>=sd){(overrides[nt.id]=overrides[nt.id]||{})[k]=ov[k];delete ov[k]}
  list.push(nt);return nt;
}
function cycleChangeFields(id,x){
  const nx=occurrences(x,addDays(todayKey(),1),'2999-12-31',1)[0];
  return`<details id="${id}"><summary>改周期（由某日起生效，之前記錄保留）</summary><div class="stack" style="margin-top:12px"><div class="field"><span>新周期由幾時開始（日子可以唔揀）</span>${dateFields(id+'-s',nx?(nx.noDay?nx.key:nx.date):todayKey())}</div>${cycleFields(id+'-c',x.freq,x.every)}</div></details>`;
}

/* ===================== 垃圾筒 ===================== */
// 手動刪除嘅記錄會擺入垃圾筒 60 日，可以逐筆或者全部還原
function trashPut(kind,item,extra={}){S.trash.unshift({id:uid(),kind,at:fmtLocal(new Date()),item:JSON.parse(JSON.stringify(item)),...extra})}
function trashRestore(e){
  if(e.kind==='txn'){if(!S.txns.some(t=>t.id===e.item.id))S.txns.push(e.item)}
  else if(e.kind==='income'){if(!S.incomeEntries.some(x=>x.id===e.item.id))S.incomeEntries.push(e.item)}
  else if(e.kind==='fx'){const o=(S.billOverrides[e.bid]||{});if(o[e.key]&&o[e.key].skip)delete o[e.key]}
  S.trash=S.trash.filter(x=>x!==e);
}
function trashLabel(e){
  const it=e.item;const k={txn:'支出',income:'收入',fx:'定期繳費一期'}[e.kind]||'';
  const when=e.kind==='income'?`${it.month}${it.day?'-'+pad(it.day):''}`:e.kind==='fx'?e.key:(it.noDay?it.ts.slice(0,7):it.ts.slice(0,16).replace('T',' '));
  return{name:(e.kind==='income'?it.name:it.merchant)||'（冇描述）',k,when,amount:it.amount};
}
function openTrash(){
  const draw=()=>{const list=S.trash;
    openSheet(`垃圾筒（${list.length}）`,`<div class="small muted">手動刪除嘅記錄會留喺度 60 日，之後自動清走。</div>
      ${list.length?`<div class="list">${list.map(e=>{const l=trashLabel(e);return`<div class="li"><span class="grow"><span class="t" style="display:block">${esc(l.name)}</span><span class="m">${l.k} · ${esc(l.when)} · 刪除於 ${+e.at.slice(5,7)}/${+e.at.slice(8,10)} ${e.at.slice(11,16)}${e.reason?' · '+esc(e.reason):''}</span></span><span class="amt num">${money(l.amount)}</span><button class="btn sm ghost" type="button" data-rs="${e.id}">還原</button></div>`}).join('')}</div>
      <div class="actions"><button class="btn" type="button" id="tr-all">全部還原（${list.length}）</button><button class="btn danger" type="button" id="tr-empty">清空垃圾筒</button></div>`:'<div class="empty">垃圾筒係空嘅</div>'}`,()=>{
        document.querySelectorAll('[data-rs]').forEach(b=>b.onclick=()=>{const e=S.trash.find(x=>x.id===b.dataset.rs);if(e){trashRestore(e);save();draw();toast('已還原')}});
        const all=$('#tr-all');if(all)all.onclick=()=>{const n=S.trash.length;[...S.trash].forEach(trashRestore);save();closeSheet();render();toast(`已還原 ${n} 筆`)};
        const em=$('#tr-empty');if(em)arm(em,()=>{S.trash=[];save();closeSheet();render();toast('已清空垃圾筒')},'再按一次：永久刪除');
      });};
  draw();
}

  return one(SC_LIST[0],'btn')+`<div class="actions">${one(SC_LIST[1],'btn ghost')}</div><div class="actions">${SC_LIST.slice(2).map(x=>one(x,'btn ghost')).join('')}</div>`;
}
function selectText(id){const r=document.createRange();r.selectNodeContents($('#'+id));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('已選取，撳「拷貝」')}
$('#file-inbox').onchange=async e=>{const f=e.target.files[0];if(!f)return;const t=await f.text();e.target.value='';showImportResult(importText(t))};
$('#file-settings').onchange=async e=>{const f=e.target.files[0];if(!f)return;e.target.value='';try{const o=JSON.parse(await f.text());
  if(o&&(o.kind==='ledger-settings'||o.kind==='ledger-cards'))openRestoreSettings(o);
  else if(o&&Array.isArray(o.txns))openRestoreSettings(Object.assign(settingsPackFrom(o),{at:'（完整備份）'}));else throw 0}catch(err){toast('呢個唔係錢跡設定檔')}};
function settingsPackFrom(st){const keep=S;try{S=hydrate(st);return settingsPack(false)}finally{S=keep}}
$('#file-backup').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const o=JSON.parse(await f.text());if(!o||!Array.isArray(o.txns))throw 0;S=hydrate(o);save();render();toast(`已還原 ${S.txns.length} 筆記錄`)}catch(err){toast('呢個唔係錢跡備份檔')}e.target.value=''};
$('#btn-hide').onclick=()=>{S.settings.hideIncome=!S.settings.hideIncome;save();render()};
$('#btn-import').onclick=()=>CONN?syncPull(true):openImport();
document.querySelectorAll('.tabbar [data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
function setTab(t){ui.tab=t;try{localStorage.setItem('ledger.tab',t)}catch(e){}render();window.scrollTo(0,0)}

function updateBadge(){const n=S.txns.filter(t=>t.status==='pending').length;const bd=$('#badge');bd.hidden=!n;bd.textContent=n}
function render(){
  autoFixPending();rebuild();
  ['overview','records','cards','analysis'].forEach(k=>{$('#tab-'+k).hidden=k!==ui.tab;document.querySelector(`.tabbar [data-tab="${k}"]`)[k===ui.tab?'setAttribute':'removeAttribute']('aria-current','page')});
  ({overview:renderOverview,records:renderRecords,cards:renderCards,analysis:renderAnalysis})[ui.tab]();
  updateBadge();
  $('#btn-hide').textContent=S.settings.hideIncome?'顯示收入':'隱藏收入';
}
{collectSenders();const n=cleanBlockedMail(),q=pendMailIncome();moveAutoIncome();fixL4All();migrateOcto();save();if(n||q)setTimeout(()=>toast([n?`已清走 ${n} 筆推廣電郵記錄（喺垃圾筒可以還原）`:'',q?`${q} 筆電郵收入改咗做待核實`:''].filter(Boolean).join(' · ')),400)}
refreshStatuses();render();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
setInterval(()=>{if(document.hidden)return;refreshStatuses();if(CONN)syncPull(false);else softRender()},60000);
document.addEventListener('visibilitychange',()=>{if(!CONN)return;if(document.hidden){if(SYNC.dirty)syncPush()}else syncPull(false)});
if(CONN)syncPull(false);
// 主畫面 app 有時會用舊嘅暫存版本：開 app 時向網站攞最新版本比較，有新版就提你重新載入
async function checkUpdate(manual){
  if(IN_PREVIEW||!/^https?:/.test(location.protocol)){if(manual)toast('呢個版本唔支援檢查更新');return}
  try{const r=await fetch(location.href.split('#')[0],{cache:'reload'});const t=await r.text();const m=t.match(/APP_VERSION='([^']+)'/);
    if(m&&m[1]!==APP_VERSION)toast(`有新版本 ${m[1]}`,'重新載入',()=>location.reload());
    else if(manual)toast('已經係最新版本 '+APP_VERSION);}
  catch(e){if(manual)toast('檢查唔到更新：'+e.message)}
}
checkUpdate(false);
</script>
